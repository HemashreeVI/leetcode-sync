<svg xmlns="http://www.w3.org/2000/svg" width="880" height="770" viewBox="0 0 880 770" role="img" aria-label="LeetCode Journey: 8 problems solved, 3 easy, 5 medium, 0 hard, all in Java">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".3" stop-color="#818cf8"/><stop offset=".65" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neonOuter" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="neonMid" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060608"/><stop offset="1" stop-color="#020203"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e5e7eb; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .muted { fill: #9ca3af; }
      .h { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .panel { fill: #0b0b0f; stroke: #2a2a33; stroke-width: 1.3; }
      .glowline { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      .fade { opacity: 0; animation: in .8s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .5s } .d4 { animation-delay: .7s } .d5 { animation-delay: .9s }
      @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    </style>
    <filter id="eyeglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- neon card -->
  <g transform="translate(20,130)">
  <rect class="pulse" x="14" y="14" width="812" height="592" rx="34" fill="none" stroke="url(#border)" stroke-width="14" filter="url(#neonOuter)"/>
  <rect x="14" y="14" width="812" height="592" rx="34" fill="url(#bg)"/>
  <rect x="14" y="14" width="812" height="592" rx="34" fill="none" stroke="url(#border)" stroke-width="7" filter="url(#neonMid)"/>
  <rect x="14" y="14" width="812" height="592" rx="34" fill="none" stroke="url(#border)" stroke-width="3.5"/>
  <rect x="380.0" y="26" width="80" height="12" rx="6" fill="#141419" stroke="#3a3a44" stroke-width="1.5"/>


  <!-- card -->

  <!-- header -->
  <g class="fade d1">
    <rect x="44" y="44" width="11" height="11" rx="2" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="64" y="54" class="mono muted" font-size="13">README.md</text>
    <text x="44" y="102" font-size="38" font-weight="800" fill="#ffffff">LeetCode <tspan fill="url(#title)">Journey</tspan></text>
    <text x="44" y="132" font-size="15" class="muted">Daily problem solving in Java · auto-synced with LeetHub</text>
  </g>

  <!-- badge -->
  <g class="fade d1">
    <circle cx="738" cy="92" r="50" fill="#0b0b0f" stroke="url(#border)" stroke-width="4" filter="url(#glow)"/>
    <text x="738" y="105" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="url(#title)">&lt;/&gt;</text>
  </g>

  <!-- Problems solved -->
  <g class="fade d2">
    <rect class="panel" x="44" y="168" width="366" height="196" rx="16"/>
    <text x="66" y="200" class="h">🧩 Problems Solved</text>
    <circle cx="140" cy="280" r="50" fill="none" stroke="#1f2433" stroke-width="16"/>
    <circle cx="140" cy="280" r="50" fill="none" stroke="#00b8a3" stroke-width="16" stroke-dasharray="117.8 314.16" transform="rotate(-90 140 280)"/>
    <circle cx="140" cy="280" r="50" fill="none" stroke="#ffc01e" stroke-width="16" stroke-dasharray="196.35 314.16" stroke-dashoffset="-117.8" transform="rotate(-90 140 280)"/>
    <text x="140" y="288" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">8</text>
    <text x="140" y="306" text-anchor="middle" font-size="11" class="muted">solved</text>

    <circle cx="232" cy="242" r="6" fill="#00b8a3"/>
    <text x="246" y="247" font-size="15">Easy</text><text x="384" y="247" text-anchor="end" font-size="15" font-weight="700">3</text>
    <circle cx="232" cy="280" r="6" fill="#ffc01e"/>
    <text x="246" y="285" font-size="15">Medium</text><text x="384" y="285" text-anchor="end" font-size="15" font-weight="700">5</text>
    <circle cx="232" cy="318" r="6" fill="#ef4743"/>
    <text x="246" y="323" font-size="15">Hard</text><text x="384" y="323" text-anchor="end" font-size="15" font-weight="700">0</text>
  </g>

  <!-- Top topics -->
  <g class="fade d3">
    <rect class="panel" x="430" y="168" width="366" height="196" rx="16"/>
    <text x="452" y="200" class="h">🔥 Top Topics</text>
    <g font-size="14">
      <text x="452" y="230">Array</text>        <rect x="572" y="220" width="170" height="10" rx="5" fill="#1c1c24"/><rect x="572" y="220" width="170" height="10" rx="5" fill="url(#bar)"/><text x="772" y="230" text-anchor="end" font-weight="700">5</text>
      <text x="452" y="257">Math</text>         <rect x="572" y="247" width="170" height="10" rx="5" fill="#1c1c24"/><rect x="572" y="247" width="102" height="10" rx="5" fill="url(#bar)"/><text x="772" y="257" text-anchor="end" font-weight="700">3</text>
      <text x="452" y="284">String</text>       <rect x="572" y="274" width="170" height="10" rx="5" fill="#1c1c24"/><rect x="572" y="274" width="102" height="10" rx="5" fill="url(#bar)"/><text x="772" y="284" text-anchor="end" font-weight="700">3</text>
      <text x="452" y="311">Two Pointers</text> <rect x="572" y="301" width="170" height="10" rx="5" fill="#1c1c24"/><rect x="572" y="301" width="68" height="10" rx="5" fill="url(#bar)"/><text x="772" y="311" text-anchor="end" font-weight="700">2</text>
      <text x="452" y="338">Linked List</text>  <rect x="572" y="328" width="170" height="10" rx="5" fill="#1c1c24"/><rect x="572" y="328" width="34" height="10" rx="5" fill="url(#bar)"/><text x="772" y="338" text-anchor="end" font-weight="700">1</text>
    </g>
  </g>

  <!-- Recent solutions -->
  <g class="fade d4">
    <rect class="panel" x="44" y="384" width="466" height="144" rx="16"/>
    <text x="66" y="416" class="h">📝 Recent Solutions</text>
    <g font-size="14">
      <text x="66" y="446">• Find Subtree Sizes After Changes</text><text x="488" y="446" text-anchor="end" font-size="12" fill="#ffc01e">Medium</text>
      <text x="66" y="472">• Min Changes to Make Binary String Beautiful</text><text x="488" y="472" text-anchor="end" font-size="12" fill="#ffc01e">Medium</text>
      <text x="66" y="498">• Check if All A's Appears Before All B's</text><text x="488" y="498" text-anchor="end" font-size="12" fill="#00b8a3">Easy</text>
    </g>
  </g>

  <!-- Language -->
  <g class="fade d4">
    <rect class="panel" x="530" y="384" width="266" height="144" rx="16"/>
    <text x="552" y="416" class="h">☕ Language</text>
    <circle cx="560" cy="447" r="6" fill="#b07219"/>
    <text x="574" y="452" font-size="15">Java</text>
    <text x="774" y="452" text-anchor="end" font-size="15" font-weight="700">100%</text>
    <rect x="552" y="466" width="222" height="10" rx="5" fill="#b07219"/>
    <text x="552" y="506" font-size="13" class="muted">12 topics covered</text>
  </g>

  <!-- footer -->
  <g class="fade d5">
    <rect class="panel" x="44" y="546" width="752" height="44" rx="14"/>
    <text x="66" y="574" font-size="15" font-weight="700" fill="#ffffff">🚀 One problem a day keeps the bugs away</text>
    <text x="774" y="574" text-anchor="end" font-size="12" class="muted">Synced with LeetHub v2</text>
  </g>
  </g>

  <!-- lanyard -->
  <g>
    <line x1="140.0" y1="-20" x2="414.0" y2="112" stroke="#34343f" stroke-width="48" stroke-linecap="square"/>
    <line x1="140.0" y1="-20" x2="414.0" y2="112" stroke="#0a0a0d" stroke-width="44" stroke-linecap="square"/>
    <line x1="154.0" y1="-13" x2="400.0" y2="105" stroke="#e5e7eb" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 46"/>
    <line x1="740.0" y1="-20" x2="466.0" y2="112" stroke="#34343f" stroke-width="48" stroke-linecap="square"/>
    <line x1="740.0" y1="-20" x2="466.0" y2="112" stroke="#0a0a0d" stroke-width="44" stroke-linecap="square"/>
    <line x1="726.0" y1="-13" x2="480.0" y2="105" stroke="#e5e7eb" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 46"/>
    <!-- hanging tag -->
    <line x1="590.0" y1="52" x2="590.0" y2="78" stroke="#9ca3af" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="558.0" y="78" width="64" height="64" rx="14" fill="#060608" stroke="url(#border)" stroke-width="3" filter="url(#eyeglow)"/>
    <text x="590.0" y="112" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#e5e7eb">&lt;/&gt;</text>
    <text x="590.0" y="131" text-anchor="middle" font-size="10" fill="#e5e7eb">LeetCode</text>
    <!-- clip -->
    <rect x="410.0" y="96" width="60" height="44" rx="9" fill="#2b2b33" stroke="#6b7280" stroke-width="2"/>
    <rect x="426.0" y="106" width="28" height="22" rx="4" fill="#0a0a0d" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="432.0" y="138" width="16" height="24" rx="4" fill="#3a3a44" stroke="#6b7280" stroke-width="1.5"/>
  </g>
</svg>
